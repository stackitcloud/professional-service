# costguard — complete annotated YAML configuration.
#
# Every field here can also be supplied via environment variables
# (COSTGUARD_*, see.env.example). Environment variables take precedence
# over values in this file. Secrets (service account keys, webhook URLs,
# S3/SM credentials, HMAC secret) should be supplied via environment
# variables from a secret store, not in this file.

# Watch scope: "organisation" or "folder".
scope: organisation
# STACKIT organisation UUID.
orgId: 00000000-0000-0000-0000-000000000000
# Folder UUIDs to traverse (required when scope is "folder").
#folderIds:
# - 11111111-1111-1111-1111-111111111111
# Regions to scan for IaaS resources.
regions:
  - eu01
# Projects older than this many days are hygiene candidates (>= 7).
maxAgeDays: 90
# Network areas older than this many days are hygiene candidates (>= 7).
snaMaxAgeDays: 60
# Label key/value that protects a resource from deletion and from reports.
safeLabelKey: do-not-delete
safeLabelValue: "true"
# Output mode: googlechat, slack or teams.
# "prometheus" is rejected at startup (not available in v1).
output: googlechat
# Webhook URL of the target chat space / channel.
webhookUrl: https://chat.googleapis.com/v1/spaces/SPACE_ID/messages?key=KEY&token=TOKEN
# true = scan and report only, no deletions. Dry run is the safe default;
# set to false only on the weekly execution (delete) workload.
dryRun: true
# Percent increase of the last 7-day spend average over the preceding
# 7-day average that flags a cost anomaly.
costAnomalyThresholdPct: 20
# Monthly price per GB for the estimated savings of detached volumes.
volumeCostEurPerGB: 0.0619
# Monthly reservation price per idle public IP for the estimated savings.
publicIPCostEurPerMonth: 4.82
# How long a newly marked candidate stays in warning state before it
# becomes deletable. Must exceed the 1 h scan->delete offset (>= 2h).
gracePeriod: 8h
# Public URL of the callback server (enables interactive buttons).
#callbackUrl: https://costguard-callback.example
# Port of the callback server.
callbackPort: 8080
# HMAC secret for button URL signing (env var recommended).
#callbackSecret:
# STACKIT Secrets Manager (Vault KV v2) path of the shared whitelist.
#whitelistSecretPath: secret/costguard/whitelist
# Dedicated Secrets Manager instance hosting the whitelist.
secretsManager:
  #url: https://secretsmanager.eu01.onstackit.cloud/INSTANCE_ID
  #username: costguard-whitelist-reader
  #password:
# Cost chart upload target (all five fields or none).
s3:
  #endpoint: https://object.storage.eu01.onstackit.cloud
  #region: eu01
  #accessKey:
  #secretKey:
  #bucket: costguard-charts
# Static whitelist; merged with the env CSV variables and the Secrets
# Manager entry — a resource listed in any source is protected.
whitelist:
  # Projects excluded from all candidates; never appear in reports.
  projects: []
  # Folders whose projects are all excluded; invisible in reports.
  folders: []
  # Specific volumes that are never deleted.
  volumes: []
  # Specific public IPs that are never deleted.
  publicIps: []
  # Volume scanning skipped entirely for these projects.
  skipVolumeScanProjects: []
  # Public IP scanning skipped entirely for these projects.
  skipPublicIpScanProjects: []
