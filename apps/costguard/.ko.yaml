# ko image build: the static binary on distroless. The :nonroot tag runs as
# uid 65532, so no user needs to be set. ko resolves the base to a digest at
# build time, so every release picks up the current base image.
defaultBaseImage: gcr.io/distroless/static:nonroot
defaultPlatforms:
  - linux/amd64
  - linux/arm64
builds:
  - id: costguard
    main: ./cmd/costguard
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
      - -w
      # Set by the release workflow; local builds report "dev". ko fails on
      # a missing {{.Env.X}}, while index yields "" for an unset variable.
      - -X main.version={{ index .Env "COSTGUARD_VERSION" }}
