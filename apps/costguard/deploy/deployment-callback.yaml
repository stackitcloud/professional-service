# costguard — protect callback server (stage 2).
#
# Serves GET/POST /protect (HMAC + expiry validation, existence check,
# KV v2 compare-and-swap whitelist append) and /healthz. Stateless:
# replicas may scale freely, no local state.
#
# Service account scope: read (existence check on RM/IaaS) + write to the
# DEDICATED whitelist Secrets Manager instance only. This account
# holds no deletion rights — a compromise here protects nothing and
# deletes nothing.
#
# Public reachability: the interactive buttons call COSTGUARD_CALLBACK_URL
# from the user's browser, so front this Service with the customer's ALB
# (or ingress). The URL itself goes into the scan/delete credentials as
# COSTGUARD_CALLBACK_URL and into the HMAC secret COSTGUARD_CALLBACK_SECRET.
#
# Image registry: built+pushed to the internal Forgejo registry by
#.forgejo/workflows/docker.yml on v* tag pushes. For customer delivery push
# the image to a registry the customer can reach and update the `image:` ref.
#
# Prerequisites:
# kubectl -n costguard create secret generic costguard-callback-credentials \
# --from-literal=stackit-service-account-key="$(cat sa-key-callback.json)" \
# --from-literal=sm-url='https://secretsmanager.eu01.onstackit.cloud/INSTANCE_ID' \
# --from-literal=sm-username=costguard-whitelist-writer \
# --from-literal=sm-password='...' \
# --from-literal=callback-hmac-secret="$(openssl rand -hex 32)"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: costguard-callback
  namespace: costguard
  labels:
    app.kubernetes.io/name: costguard
    app.kubernetes.io/component: callback
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: costguard-callback
  namespace: costguard
  labels:
    app.kubernetes.io/name: costguard
    app.kubernetes.io/component: callback
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: costguard
      app.kubernetes.io/component: callback
  template:
    metadata:
      labels:
        app.kubernetes.io/name: costguard
        app.kubernetes.io/component: callback
    spec:
      serviceAccountName: costguard-callback
      containers:
         - name: costguard
           # Pin the immutable release tag (built+pushed by.forgejo/workflows/docker.yml on
           # v* tag pushes). Bump per release; keep in step with the scan/delete CronJobs.
           image: professional-service.git.onstackit.cloud/professional-service-best-practices/professional-service/costguard:v0.0.1
           imagePullPolicy: IfNotPresent
           args: ["callback"]
           ports:
            - name: http
              containerPort: 8080
           env:
            # The callback validates the full configuration at startup;
            # only the fields below are exercised by this subcommand
            #. Scope/org are still required and must match the
            # scan scope so existence checks resolve.
            - name: COSTGUARD_SCOPE
              value: organisation
            - name: COSTGUARD_ORG_ID
              value: "00000000-0000-0000-0000-000000000000"
            - name: COSTGUARD_REGIONS
              value: eu01
            - name: COSTGUARD_MAX_AGE_DAYS
              value: "90"
            - name: COSTGUARD_SNA_MAX_AGE_DAYS
              value: "60"
            - name: COSTGUARD_SAFE_LABEL_KEY
              value: do-not-delete
            - name: COSTGUARD_SAFE_LABEL_VALUE
              value: "true"
            - name: COSTGUARD_OUTPUT
              value: googlechat
            - name: COSTGUARD_WEBHOOK_URL
              value: http://invalid-not-used-by-callback
            - name: COSTGUARD_CALLBACK_URL
              value: https://costguard-callback.example
            - name: COSTGUARD_CALLBACK_PORT
              value: "8080"
            - name: COSTGUARD_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: costguard-callback-credentials
                  key: callback-hmac-secret
            - name: COSTGUARD_WHITELIST_SECRET_PATH
              value: secret/costguard/whitelist
            - name: COSTGUARD_SM_URL
              valueFrom:
                secretKeyRef:
                  name: costguard-callback-credentials
                  key: sm-url
            - name: COSTGUARD_SM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: costguard-callback-credentials
                  key: sm-username
            - name: COSTGUARD_SM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: costguard-callback-credentials
                  key: sm-password
            - name: LOG_LEVEL
              value: info
            # STACKIT authentication (service account key file).
            - name: STACKIT_SERVICE_ACCOUNT_KEY_PATH
              value: /secrets/stackit-service-account-key.json
           startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
           readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
           livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
           securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
           resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
           volumeMounts:
            - name: sa-key
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: sa-key
          secret:
            secretName: costguard-callback-credentials
            items:
              - key: stackit-service-account-key
                path: stackit-service-account-key.json
---
apiVersion: v1
kind: Service
metadata:
  name: costguard-callback
  namespace: costguard
  labels:
    app.kubernetes.io/name: costguard
    app.kubernetes.io/component: callback
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: costguard
    app.kubernetes.io/component: callback
  ports:
    - name: http
      port: 8080
      targetPort: http
