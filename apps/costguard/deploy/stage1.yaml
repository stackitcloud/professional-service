# costguard stage 1: a report every Monday 08:00. Nothing is changed; the
# STACKIT service account only needs read access.
#
# Login, one of:
#   - workload identity (SKE): set the annotation to your stage-1 STACKIT
#     service account and give that account a federated identity provider
#     for subject system:serviceaccount:costguard:costguard-stage1;
#   - a key: delete the annotation line and create the costguard-sa-key
#     secret (see the README).
#
# The image reference is resolved to a pinned digest in each release; use
# the stage1.yaml attached to the release, not this template.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: costguard-stage1
  namespace: costguard
  labels:
    app.kubernetes.io/name: costguard
  annotations:
    workload-identity.stackit.cloud/service-account-email: REPLACE-WITH-STAGE1-SA@sa.stackit.cloud
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: costguard-report
  namespace: costguard
  labels:
    app.kubernetes.io/name: costguard
    app.kubernetes.io/component: report
spec:
  schedule: "0 8 * * 1"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A retry would post a second message.
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: costguard
            app.kubernetes.io/component: report
        spec:
          serviceAccountName: costguard-stage1
          automountServiceAccountToken: false
          restartPolicy: Never
          # Time between SIGTERM and kill: enough to post what happened.
          terminationGracePeriodSeconds: 60
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: costguard
              image: ko://github.com/stackitcloud/professional-service/apps/costguard/cmd/costguard
              args: ["report"]
              env:
                - name: COSTGUARD_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: costguard-webhook
                      key: url
                - name: LOG_LEVEL
                  value: info
                # Only used without workload identity: the key from the
                # optional costguard-sa-key secret.
                - name: STACKIT_SERVICE_ACCOUNT_KEY_PATH
                  value: /var/run/secrets/costguard/key.json
              volumeMounts:
                - name: config
                  mountPath: /etc/costguard
                  readOnly: true
                - name: sa-key
                  mountPath: /var/run/secrets/costguard
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: config
              configMap:
                name: costguard-config
            - name: sa-key
              secret:
                secretName: costguard-sa-key
                optional: true
