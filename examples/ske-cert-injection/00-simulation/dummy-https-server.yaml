apiVersion: v1
kind: Service
metadata:
  name: dummy-server
  namespace: default
spec:
  selector:
    app: dummy-server
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: v1
kind: Pod
metadata:
  name: dummy-server
  namespace: default
  labels:
    app: dummy-server
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      imagePullPolicy: IfNotPresent
      ports:
        - name: https
          containerPort: 443
      command:
        - /bin/sh
        - -c
        - |
          set -e
          cat >/etc/nginx/conf.d/default.conf <<'EOF'
          server {
              listen 443 ssl;
              server_name dummy-server.default.svc.cluster.local;

              ssl_certificate /etc/nginx/tls/tls.crt;
              ssl_certificate_key /etc/nginx/tls/tls.key;

              location / {
                  default_type text/plain;
                  return 200 "dummy HTTPS server reached\n";
              }
          }
          EOF
          exec nginx -g 'daemon off;'
      volumeMounts:
        - name: dummy-tls
          mountPath: /etc/nginx/tls
          readOnly: true
  volumes:
    - name: dummy-tls
      secret:
        secretName: dummy-tls
