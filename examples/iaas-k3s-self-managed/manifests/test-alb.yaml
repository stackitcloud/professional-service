# Test: STACKIT Application Load Balancer (L7) via ALB Ingress controller
#
# Creates an IngressClass backed by the STACKIT ALB controller, then an Ingress
# that routes HTTP traffic to a demo deployment via a NodePort service.
#
# The ALB controller watches the Ingress, provisions a STACKIT ALB, and updates
# the Ingress status with the external IP.
#
# Verify:
#   kubectl get ingress -n test-alb -o wide   # ADDRESS appears once ALB is up (~60 s)
#   curl -H "Host: test-alb.example.com" http://<ADDRESS>/
#
# Note: TLS can be added by attaching a tls block and a kubernetes.io/tls Secret.
---
apiVersion: v1
kind: Namespace
metadata:
  name: test-alb
---
# IngressClass — tells the ALB controller which Ingress objects to manage.
# network-mode=NodePort is required; the ALB reaches pods via node IPs + NodePort.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: stackit-alb
  annotations:
    alb.stackit.cloud/network-mode: "NodePort"
spec:
  controller: stackit.cloud/alb-ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: test-alb
  labels:
    app: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: nginxdemos/hello:plain-text
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: test-alb
spec:
  type: NodePort
  selector:
    app: hello
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  namespace: test-alb
spec:
  ingressClassName: stackit-alb
  rules:
    - host: test-alb.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: 80
