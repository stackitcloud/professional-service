# Test: Cilium CNI — NetworkPolicy enforcement
#
# Deploys a web server, a NetworkPolicy that allows only role=allowed-client pods,
# and two Jobs whose logs reveal whether enforcement is working.
#
# Check results:
#   kubectl get jobs -n test-cilium
#   kubectl logs -n test-cilium job/allowed-client
#   kubectl logs -n test-cilium job/blocked-client
#
# Expected outcome:
#   allowed-client  Completed   — "✓ PASS: reached web-server"
#   blocked-client  Completed   — "✓ PASS: connection was blocked by Cilium"
#
# Verify Cilium status:
#   kubectl -n kube-system exec ds/cilium -- cilium status
#   kubectl -n kube-system exec ds/cilium -- cilium policy get
---
apiVersion: v1
kind: Namespace
metadata:
  name: test-cilium
---
# Target: a simple nginx pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: test-cilium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-server
  namespace: test-cilium
spec:
  selector:
    app: web-server
  ports:
    - port: 80
      targetPort: 80
---
# NetworkPolicy: only pods with role=allowed-client may reach the web server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-specific-client
  namespace: test-cilium
spec:
  podSelector:
    matchLabels:
      app: web-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: allowed-client
      ports:
        - port: 80
---
# Allowed client Job — waits for the web server then verifies it can reach it.
# Should complete with exit 0 and log "✓ PASS".
apiVersion: batch/v1
kind: Job
metadata:
  name: allowed-client
  namespace: test-cilium
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        role: allowed-client
    spec:
      restartPolicy: Never
      containers:
        - name: curl
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "=== Allowed client: expecting HTTP 200 ==="
              until curl -sf --max-time 3 http://web-server/ > /dev/null 2>&1; do
                echo "Waiting for web-server to be ready..."
                sleep 3
              done
              echo "✓ PASS: allowed-client reached web-server"
              curl -s http://web-server/ | head -5
---
# Blocked client Job — waits 60 s for the web server to be fully up, then verifies
# that Cilium drops its connection. Exits 0 (PASS) if blocked, 1 (FAIL) if reachable.
apiVersion: batch/v1
kind: Job
metadata:
  name: blocked-client
  namespace: test-cilium
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        role: blocked-client
    spec:
      restartPolicy: Never
      containers:
        - name: curl
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "=== Blocked client: expecting connection to be dropped ==="
              echo "Waiting 60s for web-server to be fully up..."
              sleep 60
              echo "Attempting connection (should be blocked by Cilium NetworkPolicy)..."
              if curl -sf --max-time 5 http://web-server/ > /dev/null 2>&1; then
                echo "✗ FAIL: blocked-client reached web-server — NetworkPolicy is NOT enforced!"
                exit 1
              else
                echo "✓ PASS: connection was blocked by Cilium (exit code $?)"
                exit 0
              fi
