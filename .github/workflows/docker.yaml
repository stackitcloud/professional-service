# On every tag push matching v*, build the image with apps/costguard as the
# build context and push it as `latest` and as the git tag to the registry.
#
# Runs only on the internal instance: the mirror sync (github-mirror-ci.yaml)
# pushes the same tags to the public GitHub repo, but the mirror has no
# REGISTRY_* secrets and no route to the internal registry.
name: "costguard-docker"

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    name: "Build and Push Image"
    if: github.server_url == 'https://professional-service.git.onstackit.cloud'
    runs-on: "stackit-ubuntu-22"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: professional-service.git.onstackit.cloud
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: apps/costguard
          push: true
          tags: |
            professional-service.git.onstackit.cloud/professional-service-best-practices/professional-service/costguard:latest
            professional-service.git.onstackit.cloud/professional-service-best-practices/professional-service/costguard:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://professional-service.git.onstackit.cloud/professional-service-best-practices/professional-service/tree/main/apps/costguard
            org.opencontainers.image.description=STACKIT cloud hygiene bot
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=costguard
          cache-to: type=gha,mode=max,scope=costguard
