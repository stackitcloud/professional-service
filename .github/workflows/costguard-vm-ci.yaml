name: "costguard-vm-ci"

on:
  push:
    branches: ["main"]
    paths:
      - "apps/costguard-vm/**"
      - ".github/workflows/costguard-vm-ci.yaml"
  pull_request:
    paths:
      - "apps/costguard-vm/**"
      - ".github/workflows/costguard-vm-ci.yaml"

jobs:
  test:
    name: "Unit Tests + Coverage"
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'stackit-ubuntu-22' }}
    defaults:
      run:
        working-directory: apps/costguard-vm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/costguard-vm/go.mod

      - name: Unit tests + coverage gate
        run: make test

  lint:
    name: "Lint"
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'stackit-ubuntu-22' }}
    defaults:
      run:
        working-directory: apps/costguard-vm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/costguard-vm/go.mod

      - name: go vet (release and dev build)
        run: make lint

  govulncheck:
    name: "govulncheck"
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'stackit-ubuntu-22' }}
    defaults:
      run:
        working-directory: apps/costguard-vm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/costguard-vm/go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  dist:
    name: "Release build"
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'stackit-ubuntu-22' }}
    defaults:
      run:
        working-directory: apps/costguard-vm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/costguard-vm/go.mod

      # The release attaches exactly these files; building them here catches
      # a broken cross-build before a release does.
      - name: Build the release binaries (linux/amd64, linux/arm64)
        run: make dist VERSION=ci-check
