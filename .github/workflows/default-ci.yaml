name: "Default CI"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  todo-check:
    name: "Check for Open TODOs"
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'stackit-ubuntu-22' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Search codebase
        run: python3 .github/scripts/check_todos.py

  agents-md-check:
    name: "Check AGENTS.md is up to date"
    needs: [readme-tags-check]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'stackit-ubuntu-22' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check AGENTS.md
        run: python3 .github/scripts/generate_agents_md.py --check

  readme-tags-check:
    name: "Check README Tags"
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'stackit-ubuntu-22' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check tags in examples, modules, and scripts
        run: python3 .github/scripts/check_readme_tags.py

  pre-commit-checks:
    name: "Pre-Commit Hooks"
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'stackit-ubuntu-22' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install addlicense
        # Installs the tool and adds it to the GitHub Actions PATH so pre-commit can find it
        run: |
          go install github.com/google/addlicense@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
