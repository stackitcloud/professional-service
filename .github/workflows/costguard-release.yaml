name: "costguard-release"

on:
  push:
    branches: ["main"]
    paths:
      - "apps/costguard/**"
      - "!apps/costguard/**/*.md"
      - "!apps/costguard/**/*_test.go"
      - "!apps/costguard/internal/fake/**"
      - ".github/workflows/costguard-release.yaml"
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    paths:
      - "apps/costguard/**"
      - "!apps/costguard/**/*.md"
      - "!apps/costguard/**/*_test.go"
      - "!apps/costguard/internal/fake/**"
      - ".github/workflows/costguard-release.yaml"
  workflow_dispatch:

concurrency:
  group: costguard-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: "Image and release"
    if: >-
      github.server_url == 'https://professional-service.git.onstackit.cloud' &&
      (github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'build-image') &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: stackit-ubuntu-22
    defaults:
      run:
        working-directory: apps/costguard
    env:
      REGISTRY: professional-service.git.onstackit.cloud
      KO_DOCKER_REPO: professional-service.git.onstackit.cloud/professional-service-best-practices
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/costguard/go.mod

      - name: Decide what this run does
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            push)
              echo "mode=release" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "mode=test" >> "$GITHUB_OUTPUT"
              echo "version=dev-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "mode=test" >> "$GITHUB_OUTPUT"
              echo "version=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Unit tests + coverage gate
        if: steps.mode.outputs.mode == 'release'
        run: make test

      - name: Compute the next version
        id: version
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail
          prefix="apps/costguard/v"
          last="$(git tag --list "${prefix}*" --sort=-v:refname | head -n1)"
          if [ -z "${last}" ]; then
            next="0.1.0"
            notes="$(git log --format='- %s' -- .)"
          else
            IFS=. read -r major minor patch <<<"${last#"${prefix}"}"
            log="$(git log --format='%s%n%b' "${last}..HEAD" -- .)"
            if [ -z "${log}" ]; then
              echo "No costguard changes since ${last}; nothing to release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE' <<<"${log}"; then
              if [ "${major}" = 0 ]; then minor=$((minor + 1)); else major=$((major + 1)); minor=0; fi
              patch=0
            elif grep -qE '^feat(\([^)]*\))?:' <<<"${log}"; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="${major}.${minor}.${patch}"
            notes="$(git log --format='- %s' "${last}..HEAD" -- .)"
          fi
          echo "version=v${next}" >> "$GITHUB_OUTPUT"
          echo "tag=${prefix}${next}" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF_NOTES"
            echo "${notes}"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Install ko
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          version=0.19.1
          case "$(uname -m)" in
            x86_64)        arch=x86_64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          dir="$(mktemp -d)"
          base="https://github.com/ko-build/ko/releases/download/v${version}"
          curl -sSfL "${base}/ko_${version}_Linux_${arch}.tar.gz" -o "${dir}/ko_${version}_Linux_${arch}.tar.gz"
          curl -sSfL "${base}/checksums.txt" -o "${dir}/checksums.txt"
          (cd "${dir}" && grep "ko_${version}_Linux_${arch}.tar.gz" checksums.txt | sha256sum -c --)
          tar -xzf "${dir}/ko_${version}_Linux_${arch}.tar.gz" -C "${dir}" ko
          chmod +x "${dir}/ko"
          echo "${dir}" >> "$GITHUB_PATH"

      - name: Log in to the registry
        if: steps.version.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${TOKEN}" | ko login "${REGISTRY}" --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build the image and resolve the manifests
        if: steps.version.outputs.skip != 'true'
        env:
          COSTGUARD_VERSION: ${{ steps.version.outputs.version || steps.mode.outputs.version }}
        run: |
          set -euo pipefail
          flags=(
            -B
            --tags="${COSTGUARD_VERSION}"
            --image-label="org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --image-label="org.opencontainers.image.description=STACKIT cleanup bot"
            --image-label=org.opencontainers.image.licenses=Apache-2.0
            --image-label="org.opencontainers.image.version=${COSTGUARD_VERSION}"
          )
          out="${RUNNER_TEMP}/release"
          mkdir -p "${out}"
          # The image is reproducible, so the second resolve reuses the digest.
          ko resolve "${flags[@]}" -f deploy/stage1.yaml > "${out}/stage1.yaml"
          ko resolve "${flags[@]}" -f deploy/stage2.yaml > "${out}/stage2.yaml"
          cp deploy/config.yaml "${out}/config.yaml"
          grep -h "image:" "${out}"/stage*.yaml | sort -u

      - name: Tag and publish the release
        if: steps.mode.outputs.mode == 'release' && steps.version.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          set -euo pipefail
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          # Creating the release also creates the tag, on the commit that was tested.
          body="$(python3 -c 'import json, os; print(json.dumps({"tag_name": os.environ["TAG"], "target_commitish": os.environ["GITHUB_SHA"], "name": "costguard " + os.environ["VERSION"], "body": os.environ["NOTES"]}))')"
          id="$(curl -sS --fail-with-body -X POST "${api}/releases" \
            -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" -d "${body}" |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')"
          for f in config.yaml stage1.yaml stage2.yaml; do
            curl -sS --fail-with-body -X POST "${api}/releases/${id}/assets?name=${f}" \
              -H "Authorization: token ${TOKEN}" -F "attachment=@${RUNNER_TEMP}/release/${f}" > /dev/null
          done
          echo "Released ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
