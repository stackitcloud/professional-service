name: "costguard-release"

on:
  push:
    branches: ["main", "feat/add-app-costguard"]
    paths:
      - "apps/costguard/terraform/000-release.tf"
      - ".github/workflows/costguard-release.yaml"
  workflow_dispatch:

concurrency:
  group: costguard-release
  cancel-in-progress: false

jobs:
  release:
    name: "Release"
    if: >-
      startsWith(github.server_url, 'https://professional-service.git.onstackit.cloud') &&
      github.repository == 'professional-service-best-practices/professional-service'
    runs-on: stackit-ubuntu-22
    defaults:
      run:
        working-directory: apps/costguard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/costguard/go.mod

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "latest"
          terraform_wrapper: false

      - name: What is pinned
        id: pin
        run: |
          set -euo pipefail
          pin=terraform/000-release.tf
          value() { sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" "${pin}"; }
          version="$(value version)"
          if [ -z "${version}" ]; then
            echo "000-release.tf pins no release; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s\n' "${version}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "000-release.tf: version ${version} is not vMAJOR.MINOR.PATCH (optionally -pre.release), e.g. v0.2.0" >&2
            exit 1
          fi
          url="$(value download_url)"
          base="${url//"{version}"/${version}}"
          tag="apps/costguard/${version}"
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null || rc=$?
          case "${rc}" in
            0)
              echo "${tag} is released already; nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            2) ;;
            *)
              echo "cannot list the tags (git ls-remote exit ${rc})" >&2
              exit 1
              ;;
          esac
          case "${version}" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "release=true"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
            echo "base=${base%/}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} from ${GITHUB_REF_NAME} at ${GITHUB_SHA}."

      - name: Unit tests + coverage gate
        if: steps.pin.outputs.release == 'true'
        run: make test

      - name: Terraform and script tests
        if: steps.pin.outputs.release == 'true'
        run: make tf-test

      - name: Build the release files
        if: steps.pin.outputs.release == 'true'
        env:
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          make dist VERSION="${VERSION}"

      - name: Release notes
        if: steps.pin.outputs.release == 'true'
        env:
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          last="$(git tag --list 'apps/costguard/v*' --sort=-v:refname | head -n1)"
          {
            echo "Install or upgrade: check out this tag and run \`terraform apply\` in \`apps/costguard/terraform\` (see \`apps/costguard/README.md\`). Terraform reads these hashes from SHA256SUMS when it plans, and the server installs only a binary with that hash. The build is reproducible: \`make dist VERSION=${VERSION}\` at this tag builds the same files."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            if [ -n "${last}" ]; then
              echo "Changes since ${last}:"
              echo
              git log --no-merges --format='- %s' "${last}..HEAD" -- .
            else
              echo "First release."
            fi
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      - name: Publish the release
        if: steps.pin.outputs.release == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pin.outputs.tag }}
          VERSION: ${{ steps.pin.outputs.version }}
          PRERELEASE: ${{ steps.pin.outputs.prerelease }}
        run: |
          set -euo pipefail
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: token ${TOKEN}"
          curl -sS --fail-with-body -H "${auth}" "${api}/releases?draft=true&limit=50" |
            python3 -c 'import json, os, sys; [print(r["id"]) for r in json.load(sys.stdin) if r["tag_name"] == os.environ["TAG"] and r["draft"]]' |
            while read -r id; do
              echo "Deleting the draft ${id} left by an earlier run."
              curl -sS --fail-with-body -X DELETE -H "${auth}" "${api}/releases/${id}"
            done
          body="$(python3 -c 'import json, os; print(json.dumps({"tag_name": os.environ["TAG"], "target_commitish": os.environ["GITHUB_SHA"], "name": "costguard " + os.environ["VERSION"], "body": open(os.environ["RUNNER_TEMP"] + "/notes.md").read(), "draft": True, "prerelease": os.environ["PRERELEASE"] == "true", "hide_archive_links": True}))')"
          id="$(curl -sS --fail-with-body -X POST -H "${auth}" -H "Content-Type: application/json" -d "${body}" "${api}/releases" |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')"
          for f in dist/*; do
            curl -sS --fail-with-body -X POST -H "${auth}" -F "attachment=@${f}" \
              "${api}/releases/${id}/assets?name=$(basename "${f}")" > /dev/null
          done
          curl -sS --fail-with-body -X PATCH -H "${auth}" -H "Content-Type: application/json" \
            -d '{"draft": false}' "${api}/releases/${id}" > /dev/null
          echo "Released ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Download check
        if: steps.pin.outputs.release == 'true'
        env:
          BASE: ${{ steps.pin.outputs.base }}
        run: |
          set -euo pipefail
          for f in dist/*; do
            name="$(basename "${f}")"
            curl -sS -fL --proto '=https' --proto-redir '=https' -o "${RUNNER_TEMP}/${name}" "${BASE}/${name}"
            cmp "${f}" "${RUNNER_TEMP}/${name}"
            echo "OK ${name}"
          done
