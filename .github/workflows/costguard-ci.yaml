name: "costguard-ci"

on:
  push:
    paths:
      - "apps/costguard/**"
  pull_request:
    paths:
      - "apps/costguard/**"

jobs:
  test:
    name: "Unit Tests + Coverage"
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'stackit-ubuntu-22' }}
    defaults:
      run:
        working-directory: apps/costguard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/costguard/go.mod

      - name: Unit tests + coverage gate
        run: make test

  lint:
    name: "Lint"
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'stackit-ubuntu-22' }}
    defaults:
      run:
        working-directory: apps/costguard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/costguard/go.mod

      - name: go vet
        run: make lint

  # Validates the deploy/ Kubernetes manifests against the official JSON
  # schemas — offline, no cluster required. Catches both YAML syntax errors
  # and schema violations (wrong/missing/unknown fields) that check-yaml
  # (pre-commit) cannot. kubeconform is pinned for reproducibility.
  k8s-manifests:
    name: "Kubernetes Manifests"
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'stackit-ubuntu-22' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate deploy/ manifests (kubeconform)
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)    karch=amd64 ;;
            aarch64|arm64) karch=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          dir="$(mktemp -d)"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-${karch}.tar.gz" | tar -xz -C "$dir"
          "$dir/kubeconform" -strict -summary apps/costguard/deploy/*.yaml
